# QRonos · proxy inverso HTTPS (/etc/nginx/sites-available/qronos)
server {
    listen 80;
    server_name qronos.intranet.institucion.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name qronos.intranet.institucion.cl;

    ssl_certificate     /etc/ssl/qronos/qronos.crt;
    ssl_certificate_key /etc/ssl/qronos/qronos.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Permite la cámara solo en este sitio (lector de acceso)
    add_header Permissions-Policy "camera=(self)" always;

    # Solo red interna de la institución (ajustar rangos)
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location /qronos/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
